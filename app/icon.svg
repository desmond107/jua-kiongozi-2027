<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Jua Kiongozi '27">
  <!--
    Favicon build of the navbar mark (frontend/components/layout/emblem.tsx).

    Same shield-and-check geometry, retuned for a 16px tab strip:
      * opaque ink backdrop — the navbar emblem sits on a dark page and its
        off-white check would disappear against a light browser tab
      * shield fill 0.18 -> 0.30 and stroke 1.6 -> 2.2, since a faint wash and a
        hairline both vanish once the mark is 16 pixels wide
      * check stroke 2.6 -> 3.2 so it survives at the same size
      * scaled to 86% about the centre to clear the rounded corners

    Keep this in sync with the Emblem component if the mark ever changes.
  -->
  <defs>
    <linearGradient id="jk27-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1EB854" />
      <stop offset="55%" stop-color="#F5B942" />
      <stop offset="100%" stop-color="#E23D3D" />
    </linearGradient>
  </defs>

  <rect width="40" height="40" rx="9" fill="#070A12" />

  <g transform="translate(20 20) scale(0.86) translate(-20 -20)">
    <path
      d="M20 2.5 6 8.2v11.4c0 8.4 5.7 15.4 14 18 8.3-2.6 14-9.6 14-18V8.2L20 2.5Z"
      fill="url(#jk27-shield)"
      fill-opacity="0.30"
      stroke="url(#jk27-shield)"
      stroke-width="2.2"
      stroke-linejoin="round"
    />
    <path
      d="m13.6 20.2 4.6 4.6 8.2-9"
      fill="none"
      stroke="#F7F5F0"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
