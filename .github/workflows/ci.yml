name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic, throwaway secrets. These are NOT production values — they
  # exist so the app boots in CI. `tests/setup.ts` refuses to run against a
  # DATABASE_URL that does not look disposable.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jua_kiongozi_test?schema=public
  JWT_SECRET: ci-jwt-secret-value-at-least-32-characters-long
  TOKEN_HASH_SECRET: ci-token-hash-secret-at-least-32-characters!!
  IDENTITY_HASH_SECRET: ci-identity-hash-secret-at-least-32-chars!!!
  # 32 bytes base64, as backend/config/env.ts requires.
  TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  SMS_PROVIDER: console
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The build imports the generated client, so it must exist first.
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # The default build script runs migrate+seed against a live database;
        # CI has no deploy target, so only the compile step is exercised here.
        run: npx next build

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jua_kiongozi_test
        ports:
          - 5432:5432
        # Without this the suite can start before Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        # These are the ones that matter: they assert the integrity invariants
        # (one registration per citizen, one rating per candidate) against a
        # real Postgres, including under concurrency.
        run: npm run test:integration
